services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labmate
      POSTGRES_USER: labmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - labmate-postgres:/var/lib/postgresql/data
      - ./deploy/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labmate -d labmate"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://labmate:${POSTGRES_PASSWORD}@db:5432/labmate
      SESSION_HOURS: ${SESSION_HOURS:-720}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      SMS_DELIVERY_MODE: ${SMS_DELIVERY_MODE:-disabled}
      SMS_VERIFICATION_TEST_CODE: ${SMS_VERIFICATION_TEST_CODE:-}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
      LABMATE_SEED_TEACHER_PASSWORD: ${LABMATE_SEED_TEACHER_PASSWORD:?Set LABMATE_SEED_TEACHER_PASSWORD}
      LABMATE_SEED_ADMIN_PASSWORD: ${LABMATE_SEED_ADMIN_PASSWORD:?Set LABMATE_SEED_ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  labmate-postgres:
  frontend-node-modules:
