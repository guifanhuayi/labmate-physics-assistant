<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数据质量预警｜LabMate 1.0</title>
  <style>
    :root{--ink:#102f49;--muted:#607f98;--blue:#117bd1;--blue2:#0568b7;--pale:#e7f5ff;--pale2:#f4faff;--line:#b9d8ec;--danger:#d9273f;--danger-bg:#fff2f4;--success:#00865b;--shadow:0 10px 28px rgba(20,86,130,.08);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box;border-radius:0!important}body{margin:0;min-height:100vh;color:var(--ink);background:#fff}button,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:10;min-height:72px;border-bottom:1px solid var(--line);background:var(--pale);display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1240px)/2));gap:30px}.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none}.brand-mark{width:40px;height:40px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:1.25rem}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:.76rem}.topnav{display:flex;align-self:stretch}.topnav a{display:flex;align-items:center;padding:0 18px;color:var(--muted);text-decoration:none;border-inline:1px solid transparent}.topnav a.active{color:var(--blue2);background:#d6edff;border-color:var(--line);font-weight:700}.account{margin-left:auto;display:flex;align-items:center;gap:12px}.role{padding:7px 10px;background:#fff;border:1px solid var(--line);color:var(--blue2);font-size:.78rem;font-weight:700}.account button{border:0;background:transparent;color:var(--muted);padding:8px}.shell{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:30px 0 60px}.page-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:22px}.page-head h1{font-size:clamp(2rem,4vw,2.75rem);letter-spacing:-.04em;margin:0 0 7px}.page-head p{margin:0;color:var(--muted);line-height:1.65}.back{border:1px solid var(--line);background:#fff;color:var(--blue2);padding:12px 16px;text-decoration:none;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);border-top:4px solid var(--blue);background:var(--pale2);padding:18px;box-shadow:var(--shadow)}.stat.danger{border-top-color:var(--danger);background:var(--danger-bg)}.stat span{display:block;color:var(--muted);font-size:.82rem}.stat strong{display:block;margin-top:7px;font-size:2rem}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--line);background:var(--pale);padding:14px 18px;margin-bottom:18px}.toolbar b{font-size:1.06rem}.toolbar select{min-width:210px;height:42px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:0 12px}.alert-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.alert-card{border:1px solid #ef9aa6;border-left:5px solid var(--danger);background:#fff;box-shadow:var(--shadow)}.alert-main{padding:22px}.alert-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.alert-top h2{margin:0;font-size:1.15rem}.alert-top p{margin:5px 0 0;color:var(--muted);font-size:.85rem}.badge{display:inline-block;background:#fee4e8;color:var(--danger);padding:6px 9px;font-size:.78rem;font-weight:800;white-space:nowrap}.reason{margin:18px 0 0;border:1px solid #f3bdc4;background:var(--danger-bg);padding:15px;color:#9f1b31;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border:1px solid var(--line)}.metrics div{padding:12px;border-right:1px solid var(--line)}.metrics div:last-child{border:0}.metrics small,.metrics b{display:block}.metrics small{color:var(--muted);margin-bottom:5px}.actions{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line);background:#fffafa}.btn{min-height:42px;padding:0 16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.empty{grid-column:1/-1;border:1px solid var(--line);background:var(--pale2);padding:70px 20px;text-align:center}.empty b{display:block;font-size:1.25rem;margin-bottom:8px}.empty span{color:var(--muted)}.note{margin-top:18px;color:var(--muted);font-size:.82rem;line-height:1.6}.toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#163b58;color:#fff;padding:12px 18px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.topbar{padding:0 16px;gap:12px}.topnav a{padding:0 10px}.brand small{display:none}.stats{grid-template-columns:repeat(2,1fr)}.alert-grid{grid-template-columns:1fr}.shell{width:min(100% - 28px,1240px)}}
    @media(max-width:760px){.topnav{display:none}.page-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start;flex-direction:column}.toolbar select{width:100%}.metrics{grid-template-columns:1fr}.metrics div{border-right:0;border-bottom:1px solid var(--line)}.metrics div:last-child{border:0}.actions{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="teacher.html"><span class="brand-mark">λ</span><span><strong>LabMate 1.0</strong><small>物理实验数字助手</small></span></a><nav class="topnav" aria-label="教师端导航"><a href="teacher.html">教学总览</a><a href="teacher.html#submissions">学生实验</a><a class="active" href="teacher-alerts.html">数据预警</a></nav><div class="account"><span class="role">教师工作台</span><strong id="accountName">实验教师</strong><button id="signOut" type="button">退出</button></div></header>
  <main class="shell">
    <section class="page-head"><div><h1>数据质量预警</h1><p>集中检查低拟合优度、教师标记需复测，以及同一实验测量序列高度相似的提交。</p></div><a class="back" href="teacher.html">← 返回教学总览</a></section>
    <section class="stats" aria-label="预警统计"><article class="stat danger"><span>需要复核</span><strong id="alertCount">0</strong></article><article class="stat"><span>拟合异常</span><strong id="fitCount">0</strong></article><article class="stat danger"><span>数据高度相似</span><strong id="similarityCount">0</strong></article><article class="stat"><span>教师标记需复测</span><strong id="manualCount">0</strong></article></section>
    <section class="toolbar"><b>待处理预警</b><label>预警类型　<select id="filter"><option value="all">全部预警</option><option value="similarity">数据高度相似</option><option value="fit">拟合异常</option><option value="manual">教师标记</option></select></label></section>
    <section class="alert-grid" id="alertGrid" aria-live="polite"></section>
    <p class="note">数据相似度仅用于风险提示，不能单独作为学术不端认定依据；请结合原始记录、实验台号和提交时间进行人工核验。</p>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    let session=null;try{session=JSON.parse(sessionStorage.getItem('labmate_session')||'null')}catch(e){}
    if(!session){location.replace('./')}else if(session.role!=='teacher'){location.replace('student.html')}
    document.getElementById('accountName').textContent=session?.name||'实验教师';document.getElementById('signOut').addEventListener('click',()=>{sessionStorage.removeItem('labmate_session');location.href='./'});
    const defaults=[
      {id:'DEMO-1',student:'林澈',identityId:'20253141018',experiment:'单摆法测重力加速度',code:'实验一',reviewed:true,submittedAt:new Date(Date.now()-16*60000).toISOString(),rows:[{a:45,b:26.92},{a:50,b:28.38},{a:55,b:29.71},{a:60,b:31.02},{a:65,b:32.33}],result:'g = 9.784 m/s²',r2:.9984},
      {id:'DEMO-2',student:'周宁',identityId:'20253141025',experiment:'伏安法测电阻',code:'实验二',reviewed:false,submittedAt:new Date(Date.now()-42*60000).toISOString(),rows:[{a:.5,b:5},{a:1.02,b:10},{a:1.49,b:15}],result:'R = 99.25 Ω',r2:.9941},
      {id:'DEMO-3',student:'陈予安',identityId:'20253141037',experiment:'拉伸法测金属杨氏模量',code:'实验三',reviewed:false,submittedAt:new Date(Date.now()-88*60000).toISOString(),rows:[{a:.5,b:.22},{a:1,b:.36},{a:1.5,b:.7}],result:'线性斜率 k = 0.4800 mm/kg',r2:.8712},
      {id:'DEMO-4',student:'李思远',identityId:'20253141042',experiment:'光电效应测普朗克常量',code:'实验四',reviewed:false,submittedAt:new Date(Date.now()-124*60000).toISOString(),rows:[{a:5.19,b:.15},{a:5.49,b:.27},{a:6.12,b:.52},{a:6.88,b:.83}],result:'h ≈ 6.552 ×10⁻³⁴ J·s',r2:.9826},
      {id:'DEMO-5',student:'王若溪',identityId:'20253141056',experiment:'牛顿环法测透镜曲率半径',code:'实验五',reviewed:true,submittedAt:new Date(Date.now()-165*60000).toISOString(),rows:[{a:5,b:11.8},{a:10,b:23.7},{a:15,b:35.5},{a:20,b:47.6}],result:'D²–m 斜率 = 2.382 mm²',r2:.9718},
      {id:'DEMO-6',student:'赵知行',identityId:'20253141063',experiment:'单摆法测重力加速度',code:'实验一',reviewed:false,submittedAt:new Date(Date.now()-212*60000).toISOString(),rows:[{a:45,b:27.16},{a:50,b:28.24},{a:55,b:31.08},{a:60,b:30.76}],result:'g = 9.436 m/s²',r2:.8421},
      {id:'DEMO-7',student:'孙嘉禾',identityId:'20253141071',experiment:'伏安法测电阻',code:'实验二',reviewed:false,submittedAt:new Date(Date.now()-268*60000).toISOString(),rows:[{a:.52,b:5},{a:1.03,b:10},{a:1.55,b:15},{a:2.08,b:20}],result:'R = 103.42 Ω',r2:.9962},
      {id:'DEMO-8',student:'刘安澜',identityId:'20253141088',experiment:'光电效应测普朗克常量',code:'实验四',reviewed:false,submittedAt:new Date(Date.now()-326*60000).toISOString(),rows:[{a:5.19,b:.19},{a:5.49,b:.21},{a:6.12,b:.61},{a:6.88,b:.72}],result:'h ≈ 6.183 ×10⁻³⁴ J·s',r2:.8845}
    ];
    let local=[];try{local=JSON.parse(localStorage.getItem('labmate_submissions')||'[]')}catch(e){}let reviewState={};try{reviewState=JSON.parse(localStorage.getItem('labmate_teacher_reviews')||'{}')}catch(e){}let submissions=[...local,...defaults].map(s=>{const saved=reviewState[s.id],reviewDecision=saved==='approved'||saved==='retest'?saved:saved===true?(Number(s.r2)<.9?'retest':'approved'):(s.reviewed?'approved':'pending');return {...s,reviewDecision,reviewed:reviewDecision!=='pending'}});
    const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function similarityScore(left,right){if(left.experiment!==right.experiment)return 0;const a=Array.isArray(left.rows)?left.rows:[],b=Array.isArray(right.rows)?right.rows:[],n=Math.min(a.length,b.length);if(n<3)return 0;let total=0;for(let i=0;i<n;i+=1){for(const key of ['a','b']){const x=Number(a[i]?.[key]),y=Number(b[i]?.[key]);if(!Number.isFinite(x)||!Number.isFinite(y))continue;const scale=Math.max(Math.abs(x),Math.abs(y),.001);total+=Math.max(0,1-Math.abs(x-y)/scale)}}return total/(n*2)}
    function buildSimilarityMap(items){const map={};for(let i=0;i<items.length;i+=1){for(let j=i+1;j<items.length;j+=1){const score=similarityScore(items[i],items[j]);if(score<.96)continue;if(!map[items[i].id]||map[items[i].id].score<score)map[items[i].id]={with:items[j].student,score};if(!map[items[j].id]||map[items[j].id].score<score)map[items[j].id]={with:items[i].student,score}}}return map}
    const similarityMap=buildSimilarityMap(submissions);
    function alertType(s){if(s.reviewDecision==='retest')return'manual';if(s.reviewDecision==='pending'&&similarityMap[s.id])return'similarity';if(s.reviewDecision==='pending'&&Number(s.r2)<.9)return'fit';return''}
    function alertReason(s,type){if(type==='manual')return'教师已将该报告标记为需要复测，请联系学生补充原始记录或重新测量。';if(type==='similarity'){const match=similarityMap[s.id];return`与“${escape(match.with)}”的同一实验测量序列相似度 ${(match.score*100).toFixed(1)}%，疑似抄袭或共用原始记录。建议核对实验台号、原始记录和提交时间，并安排学生复测。`}return`拟合优度 R²=${Number(s.r2).toFixed(4)}，低于建议范围，数据离散较大。建议核对原始记录或安排复测。`}
    function alertLabel(type){return type==='similarity'?'疑似抄袭 · 需要复核':type==='manual'?'教师标记 · 需要复核':'拟合异常 · 需要复核'}
    function notify(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
    function decide(id,decision){const item=submissions.find(s=>s.id===id);if(!item)return;item.reviewDecision=decision;item.reviewed=true;reviewState[id]=decision;localStorage.setItem('labmate_teacher_reviews',JSON.stringify(reviewState));render();notify(decision==='retest'?'已标记为需要复测':'已确认数据正常，预警数量已更新')}
    function render(){const alerts=submissions.map(s=>({s,type:alertType(s)})).filter(x=>x.type),filter=document.getElementById('filter').value,shown=filter==='all'?alerts:alerts.filter(x=>x.type===filter);document.getElementById('alertCount').textContent=alerts.length;document.getElementById('fitCount').textContent=alerts.filter(x=>x.type==='fit').length;document.getElementById('similarityCount').textContent=alerts.filter(x=>x.type==='similarity').length;document.getElementById('manualCount').textContent=alerts.filter(x=>x.type==='manual').length;document.getElementById('alertGrid').innerHTML=shown.length?shown.map(({s,type})=>`<article class="alert-card"><div class="alert-main"><div class="alert-top"><div><h2>${escape(s.student)} · ${escape(s.experiment)}</h2><p>${escape(s.identityId||'学校账号')}　${new Date(s.submittedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</p></div><span class="badge">${alertLabel(type)}</span></div><div class="reason">${alertReason(s,type)}</div><div class="metrics"><div><small>拟合优度 R²</small><b>${Number(s.r2).toFixed(4)}</b></div><div><small>数据组数</small><b>${Array.isArray(s.rows)?s.rows.length:0} 组</b></div><div><small>当前状态</small><b>${type==='manual'?'需复测':'待教师核验'}</b></div></div></div><div class="actions"><button class="btn" data-action="approve" data-id="${escape(s.id)}" type="button">确认数据正常</button><button class="btn danger" data-action="retest" data-id="${escape(s.id)}" type="button">标记需复测</button></div></article>`).join(''):'<div class="empty"><b>暂无该类预警</b><span>当前筛选范围内没有需要处理的实验数据。</span></div>';document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>decide(btn.dataset.id,btn.dataset.action==='retest'?'retest':'approved')))}
    document.getElementById('filter').addEventListener('change',render);render();
  </script>
</body>
</html>
