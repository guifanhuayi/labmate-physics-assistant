<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教师管理工作台 · LabMate 1.0</title>
  <meta name="description" content="大学物理实验教学进度、学生提交与数据质量管理。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230071e3'/%3E%3Cpath d='M12 22l20-9 20 9-20 9-20-9zm8 7v12c8 7 16 7 24 0V29' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E" />
  <style>
    :root{color-scheme:light;--ink:#112f49;--muted:#5d7890;--blue:#0878d1;--blue2:#005faa;--pale:#e8f5ff;--pale2:#f6fbff;--line:#bfd9ec;--danger:#c82333;--success:#087d55;--warn:#a65f00;--shadow:0 12px 32px rgba(18,82,128,.09);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box;border-radius:0!important}html{font-size:16px}body{margin:0;min-height:100vh;color:var(--ink);background:#fff}button,input,select{font:inherit}button{cursor:pointer}.topbar{position:sticky;top:0;z-index:10;min-height:72px;border-bottom:1px solid var(--line);background:var(--pale);display:flex;align-items:center;padding:0 max(24px,calc((100vw - 1240px)/2));gap:30px}.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none}.brand-mark{width:40px;height:40px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:1.25rem}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:.76rem}.topnav{display:flex;align-self:stretch}.topnav a{display:flex;align-items:center;padding:0 18px;color:var(--muted);text-decoration:none;border-inline:1px solid transparent}.topnav a.active{color:var(--blue2);background:#d6edff;border-color:var(--line);font-weight:700}.account{margin-left:auto;display:flex;align-items:center;gap:12px}.role{padding:7px 10px;background:#fff;border:1px solid var(--line);color:var(--blue2);font-size:.78rem;font-weight:700}.account button{border:0;background:transparent;color:var(--muted);padding:8px}.shell{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:28px 0 56px}.page-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:20px}.page-head h1{font-size:clamp(1.8rem,4vw,2.45rem);letter-spacing:-.04em;margin:0 0 5px}.page-head p{margin:0;color:var(--muted)}.date{color:var(--muted);font-size:.84rem}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);border-top:4px solid var(--blue);background:var(--pale2);padding:18px;box-shadow:var(--shadow)}.stat span{color:var(--muted);font-size:.82rem}.stat strong{display:block;font-size:1.8rem;margin:8px 0 3px}.stat small{color:var(--success)}.stat-action{width:100%;color:var(--ink);text-align:left}.stat-action:hover,.stat-action:focus-visible,.stat-action.active{border-color:var(--blue);background:#e8f5ff;outline:2px solid transparent}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(310px,.55fr);gap:18px;align-items:start}.panel{border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:19px 21px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:1.08rem;margin:0 0 5px}.panel-head p{margin:0;color:var(--muted);font-size:.82rem}.panel-controls{display:flex;align-items:center;gap:8px}.panel-head select,.show-all{height:38px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:0 12px}.panel-head select{padding-right:30px}.show-all{color:var(--blue2);font-weight:700}.submission-head,.submission{display:grid;grid-template-columns:minmax(105px,.85fr) minmax(110px,.9fr) minmax(185px,1.45fr) minmax(105px,.8fr) minmax(90px,.75fr) 58px;align-items:center;gap:12px}.submission-head{padding:11px 20px;border-bottom:1px solid var(--line);background:var(--pale);color:#4c6f88;font-size:.75rem;font-weight:800}.submission-list{padding:0 20px}.submission{padding:16px 0;border-bottom:1px solid #d9e8f2}.submission:last-child{border:0}.student{display:flex;align-items:center;gap:10px;font-weight:750}.avatar{width:34px;height:34px;display:grid;place-items:center;background:#d8ecfa;color:var(--blue2);font-size:.78rem}.submission small{color:var(--muted)}.badge{width:max-content;padding:5px 8px;background:#e8f8f2;color:var(--success);font-size:.75rem;font-weight:700}.badge.warn{background:#fff2f2;color:var(--danger)}.view-btn{min-height:34px;border:1px solid var(--line);background:#fff;color:var(--blue2);padding:0 10px;font-weight:700}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.side-stack{display:grid;gap:18px}.chart{padding:18px}.bar-row{margin-bottom:15px}.bar-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:.8rem}.bar-label span{color:var(--muted)}.bar-track{height:10px;background:#e9f1f6}.bar-track i{display:block;height:100%;background:var(--blue)}.alert{padding:15px 18px;border-bottom:1px solid var(--line)}.alert:last-child{border:0}.alert b{font-size:.86rem}.alert p{margin:6px 0 0;color:var(--muted);font-size:.8rem;line-height:1.55}.alert.danger{border-left:4px solid var(--danger);background:#fff7f7}.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(16,47,73,.44)}.modal[hidden]{display:none}.modal-card{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:0 30px 90px rgba(11,49,78,.32)}.modal-head{display:flex;justify-content:space-between;gap:20px;padding:20px 22px;border-bottom:1px solid var(--line);background:var(--pale)}.modal-head h2{margin:0 0 4px}.modal-head p{margin:0;color:var(--muted)}.close{width:36px;height:36px;border:1px solid var(--line);background:#fff}.detail{padding:22px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-bottom:18px}.detail-grid div{padding:14px;border-right:1px solid var(--line)}.detail-grid div:last-child{border:0}.detail-grid small{display:block;color:var(--muted);margin-bottom:6px}.detail table{width:100%;border-collapse:collapse}.detail th,.detail td{text-align:left;padding:10px 12px;border:1px solid var(--line)}.detail th{background:var(--pale);color:var(--muted);font-size:.78rem}.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 22px}.btn{min-height:42px;padding:0 16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.toast{position:fixed;left:50%;bottom:24px;z-index:40;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#163b58;color:#fff;padding:12px 18px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:950px){.topbar{padding:0 16px;gap:12px}.topnav a{padding:0 10px}.brand small{display:none}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.shell{width:min(100% - 28px,1240px)}}
    @media(max-width:650px){.topnav{display:none}.page-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.panel-head{align-items:flex-start;flex-direction:column}.panel-controls{width:100%;flex-wrap:wrap}.submission,.submission-head{grid-template-columns:1fr auto auto}.submission>:nth-child(2),.submission>:nth-child(3),.submission>:nth-child(4),.submission-head>:nth-child(2),.submission-head>:nth-child(3),.submission-head>:nth-child(4){display:none}.detail-grid{grid-template-columns:1fr}.detail-grid div{border-right:0;border-bottom:1px solid var(--line)}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="teacher.html"><span class="brand-mark">λ</span><span><strong>LabMate 1.0</strong><small>物理实验数字助手</small></span></a><nav class="topnav" aria-label="教师端导航"><a class="active" href="teacher.html">教学总览</a><a href="#submissions">学生实验</a><a href="#alerts">数据预警</a></nav><div class="account"><span class="role">教师工作台</span><strong id="accountName">实验教师</strong><button id="signOut" type="button">退出</button></div></header>
  <main class="shell">
    <section class="page-head"><div><h1>大学物理实验教学总览</h1><p>查看实验进度、学生数据质量与待处理提交。</p></div><div class="date" id="today"></div></section>
    <section class="stats"><article class="stat"><span>今日实验学生</span><strong id="studentCount">32</strong><small>3 个实验班</small></article><article class="stat"><span>已提交实验</span><strong id="submissionCount">24</strong><small id="submitRate">提交率 75%</small></article><button class="stat stat-action" id="pendingReviewCard" type="button" aria-controls="submissionList" aria-pressed="false"><span>待批阅</span><strong id="pendingReviewCount">2</strong><small>点击查看未批阅报告</small></button><article class="stat"><span>需要复核</span><strong id="reviewCount">3</strong><small style="color:var(--danger)">异常或低相关性</small></article></section>
    <section class="layout">
      <article class="panel" id="submissions"><div class="panel-head"><div><h2 id="submissionTitle">最近实验提交</h2><p id="submissionDescription">学生提交后将出现在此列表，异常结果以红色标识。</p></div><div class="panel-controls"><button class="show-all" id="showAllBtn" type="button" hidden>查看全部提交</button><select id="filter" aria-label="筛选实验"><option value="all">全部实验</option><option value="单摆">单摆实验</option><option value="电阻">伏安法测电阻</option><option value="其他">其他实验</option></select></div></div><div class="submission-head" aria-hidden="true"><span>学生姓名</span><span>学号</span><span>实验名称</span><span>上传时间</span><span>数据状态</span><span>操作</span></div><div class="submission-list" id="submissionList"></div></article>
      <aside class="side-stack"><section class="panel"><div class="panel-head"><div><h2>本周实验分布</h2><p>按已安排学生人数统计</p></div></div><div class="chart"><div class="bar-row"><div class="bar-label"><span>单摆法测重力加速度</span><b>32</b></div><div class="bar-track"><i style="width:88%"></i></div></div><div class="bar-row"><div class="bar-label"><span>伏安法测电阻</span><b>28</b></div><div class="bar-track"><i style="width:77%"></i></div></div><div class="bar-row"><div class="bar-label"><span>杨氏模量</span><b>20</b></div><div class="bar-track"><i style="width:55%"></i></div></div><div class="bar-row"><div class="bar-label"><span>光电效应</span><b>16</b></div><div class="bar-track"><i style="width:44%"></i></div></div></div></section><section class="panel" id="alerts"><div class="panel-head"><div><h2>数据质量预警</h2><p>建议优先检查低拟合优度记录</p></div></div><div id="alertList"></div></section></aside>
    </section>
  </main>
  <div class="modal" id="detailModal" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-card"><div class="modal-head"><div><h2 id="detailTitle">实验提交详情</h2><p id="detailSubtitle"></p></div><button class="close" id="closeModal" type="button" aria-label="关闭">×</button></div><div class="detail"><div class="detail-grid" id="detailGrid"></div><table><thead><tr><th>序号</th><th>测量值 A</th><th>测量值 B</th></tr></thead><tbody id="detailRows"></tbody></table></div><div class="modal-actions"><button class="btn" id="returnBtn" type="button">标记需复测</button><button class="btn primary" id="approveBtn" type="button">确认数据有效</button></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    let session=null;try{session=JSON.parse(sessionStorage.getItem('labmate_session')||'null')}catch(e){}
    if(!session){location.replace('./')}else if(session.role!=='teacher'){location.replace('student.html')}
    document.getElementById('accountName').textContent=session?.name||'实验教师';document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});document.getElementById('signOut').addEventListener('click',()=>{sessionStorage.removeItem('labmate_session');location.href='./'});
    const defaults=[
      {id:'DEMO-1',student:'林澈',identityId:'20253141018',experiment:'单摆法测重力加速度',code:'实验一',reviewed:true,submittedAt:new Date(Date.now()-16*60000).toISOString(),rows:[{a:45,b:26.92},{a:50,b:28.38},{a:55,b:29.71},{a:60,b:31.02},{a:65,b:32.33}],result:'g = 9.784 m/s²',r2:.9984},
      {id:'DEMO-2',student:'周宁',identityId:'20253141025',experiment:'伏安法测电阻',code:'实验二',reviewed:false,submittedAt:new Date(Date.now()-42*60000).toISOString(),rows:[{a:.5,b:5},{a:1.02,b:10},{a:1.49,b:15}],result:'R = 99.25 Ω',r2:.9941},
      {id:'DEMO-3',student:'陈予安',identityId:'20253141037',experiment:'拉伸法测金属杨氏模量',code:'实验三',reviewed:false,submittedAt:new Date(Date.now()-88*60000).toISOString(),rows:[{a:.5,b:.22},{a:1,b:.36},{a:1.5,b:.7}],result:'线性斜率 k = 0.4800 mm/kg',r2:.8712},
      {id:'DEMO-4',student:'李思远',identityId:'20253141042',experiment:'光电效应测普朗克常量',code:'实验四',reviewed:false,submittedAt:new Date(Date.now()-124*60000).toISOString(),rows:[{a:5.19,b:.15},{a:5.49,b:.27},{a:6.12,b:.52},{a:6.88,b:.83}],result:'h ≈ 6.552 ×10⁻³⁴ J·s',r2:.9826},
      {id:'DEMO-5',student:'王若溪',identityId:'20253141056',experiment:'牛顿环法测透镜曲率半径',code:'实验五',reviewed:true,submittedAt:new Date(Date.now()-165*60000).toISOString(),rows:[{a:5,b:11.8},{a:10,b:23.7},{a:15,b:35.5},{a:20,b:47.6}],result:'D²–m 斜率 = 2.382 mm²',r2:.9718},
      {id:'DEMO-6',student:'赵知行',identityId:'20253141063',experiment:'单摆法测重力加速度',code:'实验一',reviewed:false,submittedAt:new Date(Date.now()-212*60000).toISOString(),rows:[{a:45,b:27.16},{a:50,b:28.24},{a:55,b:31.08},{a:60,b:30.76}],result:'g = 9.436 m/s²',r2:.8421},
      {id:'DEMO-7',student:'孙嘉禾',identityId:'20253141071',experiment:'伏安法测电阻',code:'实验二',reviewed:false,submittedAt:new Date(Date.now()-268*60000).toISOString(),rows:[{a:.52,b:5},{a:1.03,b:10},{a:1.55,b:15},{a:2.08,b:20}],result:'R = 103.42 Ω',r2:.9962},
      {id:'DEMO-8',student:'刘安澜',identityId:'20253141088',experiment:'光电效应测普朗克常量',code:'实验四',reviewed:false,submittedAt:new Date(Date.now()-326*60000).toISOString(),rows:[{a:5.19,b:.19},{a:5.49,b:.21},{a:6.12,b:.61},{a:6.88,b:.72}],result:'h ≈ 6.183 ×10⁻³⁴ J·s',r2:.8845}
    ];
    let local=[];try{local=JSON.parse(localStorage.getItem('labmate_submissions')||'[]')}catch(e){}let reviewState={};try{reviewState=JSON.parse(localStorage.getItem('labmate_teacher_reviews')||'{}')}catch(e){}let submissions=[...local,...defaults].map(s=>{const saved=reviewState[s.id],reviewDecision=saved==='approved'||saved==='retest'?saved:saved===true?(Number(s.r2)<.9?'retest':'approved'):(s.reviewed?'approved':'pending');return {...s,reviewDecision,reviewed:reviewDecision!=='pending'}}),selected=null,pendingOnly=false;const list=document.getElementById('submissionList'),modal=document.getElementById('detailModal'),toast=document.getElementById('toast');
    const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const experimentCodes={'单摆法测重力加速度':'实验一','伏安法测电阻':'实验二','拉伸法测金属杨氏模量':'实验三','光电效应测普朗克常量':'实验四','牛顿环法测透镜曲率半径':'实验五'};
    function displayCode(s){return experimentCodes[s.experiment]||(/^PHY-/i.test(String(s.code||''))?'物理实验':s.code||'物理实验')}
    function needsReview(s){return s.reviewDecision==='retest'||(s.reviewDecision==='pending'&&Number(s.r2)<.9)}
    function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
    function filterMatch(s,value){return value==='all'||(value==='单摆'&&s.experiment.includes('单摆'))||(value==='电阻'&&s.experiment.includes('电阻'))||(value==='其他'&&!s.experiment.includes('单摆')&&!s.experiment.includes('电阻'))}
    function render(){const value=document.getElementById('filter').value,pending=submissions.filter(s=>!s.reviewed),shown=submissions.filter(s=>filterMatch(s,value)&&(!pendingOnly||!s.reviewed));document.getElementById('submissionTitle').textContent=pendingOnly?'待批阅实验报告':'最近实验提交';document.getElementById('submissionDescription').textContent=pendingOnly?'仅显示教师尚未完成批阅的学生实验报告。':'学生提交后将出现在此列表，异常结果以红色标识。';document.getElementById('showAllBtn').hidden=!pendingOnly;document.getElementById('pendingReviewCard').classList.toggle('active',pendingOnly);document.getElementById('pendingReviewCard').setAttribute('aria-pressed',String(pendingOnly));list.innerHTML=shown.length?shown.map(s=>{const flagged=needsReview(s);return `<div class="submission"><div class="student"><span class="avatar">${escape(s.student).slice(0,1)}</span><b>${escape(s.student)}</b></div><div><small>${escape(s.identityId||'学校账号')}</small></div><div><b>${escape(s.experiment)}</b><br><small>${escape(displayCode(s))}</small></div><div><small>${new Date(s.submittedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div><div><span class="badge ${flagged?'warn':''}">${flagged?'需要复核':'数据正常'}</span></div><button class="view-btn" data-id="${escape(s.id)}" type="button">${s.reviewed?'查看':'批阅'}</button></div>`}).join(''):`<div class="empty">${pendingOnly?'当前没有待批阅的实验报告':'当前筛选条件下暂无实验提交'}</div>`;list.querySelectorAll('[data-id]').forEach(btn=>btn.addEventListener('click',()=>openDetail(btn.dataset.id)));const bad=submissions.filter(needsReview);document.getElementById('alertList').innerHTML=bad.length?bad.map(s=>`<div class="alert danger"><b>${escape(s.student)} · ${escape(s.experiment)}</b><p>${s.reviewDecision==='retest'?'教师已标记该报告需要复测，请优先联系学生补充或重新测量。':`拟合优度 R²=${Number(s.r2).toFixed(4)}，数据离散较大，建议核对原始记录或安排复测。`}</p></div>`).join(''):'<div class="alert"><b>暂无高优先级预警</b><p>当前提交的数据拟合质量均在建议范围内。</p></div>';document.getElementById('submissionCount').textContent=24+local.length;document.getElementById('pendingReviewCount').textContent=pending.length;document.getElementById('reviewCount').textContent=bad.length}
    function openDetail(id){selected=submissions.find(s=>s.id===id);if(!selected)return;document.getElementById('detailTitle').textContent=selected.experiment;document.getElementById('detailSubtitle').textContent=`${selected.student} · ${new Date(selected.submittedAt).toLocaleString('zh-CN')}`;document.getElementById('detailGrid').innerHTML=`<div><small>学生</small><b>${escape(selected.student)}</b></div><div><small>计算结果</small><b>${escape(selected.result)}</b></div><div><small>拟合优度 R²</small><b>${Number(selected.r2).toFixed(4)}</b></div>`;document.getElementById('detailRows').innerHTML=selected.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${Number(r.a)}</td><td>${Number(r.b)}</td></tr>`).join('');modal.hidden=false}
    function completeReview(decision,message){if(selected){selected.reviewDecision=decision;selected.reviewed=true;reviewState[selected.id]=decision;localStorage.setItem('labmate_teacher_reviews',JSON.stringify(reviewState))}modal.hidden=true;render();notify(message)}
    document.getElementById('filter').addEventListener('change',render);document.getElementById('pendingReviewCard').addEventListener('click',()=>{pendingOnly=true;document.getElementById('filter').value='all';render();document.getElementById('submissions').scrollIntoView({behavior:'smooth',block:'start'})});document.getElementById('showAllBtn').addEventListener('click',()=>{pendingOnly=false;render()});document.getElementById('closeModal').addEventListener('click',()=>modal.hidden=true);modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true});document.getElementById('returnBtn').addEventListener('click',()=>completeReview('retest','已批阅并将该实验标记为需要复测'));document.getElementById('approveBtn').addEventListener('click',()=>completeReview('approved','已批阅并确认该组实验数据有效'));render();
  </script>
</body>
</html>
