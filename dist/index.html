<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · LabMate 物理实验数字助手</title>
  <meta name="description" content="登录 LabMate 物理实验数字助手，进入大学物理实验工作台。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23007aff'/%3E%3Cpath d='M18 45h28M22 39l7-10 7 6 8-17' fill='none' stroke='white' stroke-width='5' stroke-linecap='square' stroke-linejoin='miter'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --secondary: #6e6e73;
      --tertiary: #86868b;
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --line: rgba(0, 0, 0, .10);
      --surface: rgba(255, 255, 255, .78);
      --danger: #c93434;
      --success: #18864b;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; border-radius: 0 !important; }
    html { font-size: 16px; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(155, 210, 255, .56), transparent 30rem),
        radial-gradient(circle at 82% 76%, rgba(192, 178, 255, .40), transparent 32rem),
        linear-gradient(145deg, #f8fbff 0%, #f5f5f7 52%, #f7f4fb 100%);
      overflow-x: hidden;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 0 28px;
      position: relative;
      isolation: isolate;
    }
    .page::before,
    .page::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .42;
      pointer-events: none;
    }
    .page::before { top: -170px; right: 8%; background: rgba(103, 191, 255, .34); }
    .page::after { bottom: -210px; left: 5%; background: rgba(180, 159, 255, .30); }

    .topbar {
      width: min(1160px, 100%);
      margin: 0 auto;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(145deg, #1689ff, #0062c6);
      box-shadow: 0 10px 28px rgba(0, 113, 227, .23), inset 0 1px 0 rgba(255,255,255,.35);
      font-size: 1.2rem;
      font-weight: 800;
    }
    .brand-copy strong { display: block; font-size: 1rem; letter-spacing: -.01em; }
    .brand-copy span { display: block; margin-top: 1px; color: var(--secondary); font-size: .78rem; }
    .secure-label { display: inline-flex; align-items: center; gap: 7px; color: var(--secondary); font-size: .84rem; }
    .secure-label svg { width: 15px; height: 15px; }

    main {
      width: 100%;
      display: grid;
      place-items: center;
      padding: 38px 0 54px;
    }
    .login-shell {
      width: min(100%, 460px);
      position: relative;
      animation: arrive .65s cubic-bezier(.22,1,.36,1) both;
    }
    .login-shell::before {
      content: "";
      position: absolute;
      inset: 18px 24px -22px;
      background: rgba(68, 127, 180, .18);
      filter: blur(34px);
      border-radius: 44px;
      z-index: -1;
    }
    .login-card {
      padding: 42px 42px 34px;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: 0 30px 80px rgba(55, 77, 101, .15), inset 0 1px 0 rgba(255,255,255,.86);
      backdrop-filter: blur(28px) saturate(145%);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
    }
    .identity-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: #fff;
      background: linear-gradient(145deg, #1689ff, #006bd6);
      box-shadow: 0 15px 34px rgba(0, 113, 227, .24), inset 0 1px 0 rgba(255,255,255,.35);
    }
    .identity-mark svg { width: 27px; height: 27px; }
    h1 { margin: 0; text-align: center; font-size: clamp(2rem, 6vw, 2.55rem); line-height: 1.08; letter-spacing: -.045em; font-weight: 700; }
    .intro { margin: 12px auto 30px; text-align: center; color: var(--secondary); line-height: 1.6; }

    .field { margin-bottom: 16px; }
    .field label { display: block; margin: 0 0 8px 3px; color: #3b3b3d; font-size: .9rem; font-weight: 600; }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 19px;
      height: 19px;
      color: var(--tertiary);
      transform: translateY(-50%);
      pointer-events: none;
    }
    input {
      width: 100%;
      height: 52px;
      padding: 0 16px 0 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.80);
      color: var(--ink);
      font-size: 1rem;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    input::placeholder { color: #a0a0a5; }
    input:focus { border-color: rgba(0,113,227,.62); box-shadow: 0 0 0 4px rgba(0,113,227,.12); background: #fff; }
    input[aria-invalid="true"] { border-color: rgba(201,52,52,.72); box-shadow: 0 0 0 4px rgba(201,52,52,.10); }
    .identity-hint { margin: -5px 3px 20px; color: var(--tertiary); font-size: .78rem; line-height: 1.5; }
    .error { min-height: 20px; margin: -7px 3px 10px; color: var(--danger); font-size: .82rem; line-height: 1.45; }

    .primary {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 11px 25px rgba(0,113,227,.22);
      font-weight: 650;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .primary:hover { background: var(--blue-hover); box-shadow: 0 13px 28px rgba(0,113,227,.28); transform: translateY(-1px); }
    .primary:active { transform: translateY(0) scale(.99); }
    .primary:focus-visible, .provider:focus-visible, .dialog-close:focus-visible { outline: 3px solid rgba(0,113,227,.28); outline-offset: 3px; }

    .divider { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 13px; margin: 26px 0 18px; color: var(--tertiary); font-size: .78rem; }
    .divider::before, .divider::after { content: ""; height: 1px; background: var(--line); }
    .providers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .provider {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #303033;
      background: rgba(255,255,255,.66);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .provider:hover { transform: translateY(-1px); background: #fff; border-color: rgba(0,0,0,.16); }
    .provider svg { width: 19px; height: 19px; }
    .provider .wechat { color: #14a845; }
    .provider .qq { color: #1686d9; font-weight: 800; font-size: 1.05rem; }
    .provider .mail { color: #6e6e73; }
    .prototype-note { margin: 17px 0 0; text-align: center; color: var(--tertiary); font-size: .75rem; line-height: 1.55; }

    footer { padding: 0 0 24px; text-align: center; color: var(--tertiary); font-size: .76rem; line-height: 1.6; }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(20, 27, 34, .26);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .2s ease, visibility .2s ease;
    }
    .dialog-backdrop.open { opacity: 1; visibility: visible; }
    .dialog {
      width: min(100%, 390px);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 28px 70px rgba(20,31,45,.24);
      transform: translateY(14px) scale(.98);
      transition: transform .22s cubic-bezier(.22,1,.36,1);
    }
    .dialog-backdrop.open .dialog { transform: translateY(0) scale(1); }
    .dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .dialog h2 { margin: 0; font-size: 1.4rem; letter-spacing: -.025em; }
    .dialog p { margin: 10px 0 22px; color: var(--secondary); line-height: 1.6; font-size: .92rem; }
    .dialog-close { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border: 0; border-radius: 50%; background: #ececef; color: #5f5f63; cursor: pointer; }
    .dialog-close svg { width: 15px; height: 15px; }
    .provider-badge { width: 48px; height: 48px; margin-bottom: 18px; display: grid; place-items: center; border-radius: 14px; background: #f1f5fa; color: var(--blue); font-weight: 800; }
    .provider-badge svg { width: 23px; height: 23px; }
    .dialog .field { margin-bottom: 14px; }
    .dialog .field input { padding-left: 16px; }
    .demo-row { display: flex; gap: 10px; }
    .demo-row input { min-width: 0; }
    .code-btn { width: 116px; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 14px; background: #f5f5f7; color: var(--blue); cursor: pointer; }
    .dialog-status { min-height: 19px; margin: 2px 1px 12px; color: var(--secondary); font-size: .8rem; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 50;
      max-width: min(90vw, 440px);
      padding: 12px 17px;
      border-radius: 12px;
      color: #fff;
      background: rgba(30,30,32,.88);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      backdrop-filter: blur(16px);
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-size: .88rem;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
    @media (max-width: 560px) {
      .page { padding: 0 16px; }
      .topbar { min-height: 68px; }
      .secure-label span { display: none; }
      main { padding: 24px 0 38px; align-items: start; }
      .login-card { padding: 32px 22px 26px; border-radius: 24px; }
      .intro { margin-bottom: 25px; }
      .providers { grid-template-columns: 1fr; }
      .provider { min-height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="./" aria-label="LabMate 登录首页">
        <span class="brand-mark" aria-hidden="true">λ</span>
        <span class="brand-copy"><strong>LabMate</strong><span>物理实验数字助手</span></span>
      </a>
      <span class="secure-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span>大学实验 · 安全登录</span>
      </span>
    </header>

    <main>
      <section class="login-shell" aria-labelledby="loginTitle">
        <div class="login-card">
          <div class="identity-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10M9 3v5l-4.4 7.1A3.8 3.8 0 0 0 7.8 21h8.4a3.8 3.8 0 0 0 3.2-5.9L15 8V3"/><path d="M7.2 14h9.6"/></svg>
          </div>
          <h1 id="loginTitle">欢迎回来</h1>
          <p class="intro">登录后继续你的大学物理实验</p>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="name">用户名</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
                <input id="name" name="name" autocomplete="name" placeholder="请输入姓名" maxlength="24" required />
              </div>
            </div>
            <div class="field">
              <label for="phone">手机号</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.2"/><path d="M10 18.5h4"/></svg>
                <input id="phone" name="phone" inputmode="numeric" autocomplete="tel" placeholder="请输入 11 位手机号" maxlength="11" required />
              </div>
            </div>
            <div class="field">
              <label for="identityId">学号 / 工号</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h5M7 13h3M15 10h2M15 14h2"/></svg>
                <input id="identityId" name="identityId" autocomplete="username" placeholder="请输入学号或工号" maxlength="24" required />
              </div>
            </div>
            <p class="identity-hint">系统将根据学校账号信息自动识别学生或教师身份。</p>
            <p class="error" id="formError" role="alert" aria-live="polite"></p>
            <button class="primary" type="submit">进入实验空间</button>
          </form>

          <div class="divider"><span>或使用以下方式登录</span></div>
          <div class="providers" aria-label="第三方登录方式">
            <button class="provider" type="button" data-provider="微信">
              <svg class="wechat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M13.8 8.2c0-3.2-3-5.7-6.5-5.7S1 4.9 1 8s2.8 5.5 6.3 5.5c.7 0 1.3-.1 1.9-.3l2.3 1.2-.6-2.1c1.8-1 2.9-2.4 2.9-4.1Z"/><path d="M10.2 13.2c0 3 2.8 5.3 6.2 5.3.7 0 1.3-.1 1.9-.3l2.2 1.1-.6-2c1.9-1 3.1-2.6 3.1-4.5 0-3-2.8-5.3-6.3-5.3-1.1 0-2.1.2-3 .6"/></svg>
              微信
            </button>
            <button class="provider" type="button" data-provider="QQ"><span class="qq" aria-hidden="true">Q</span>QQ</button>
            <button class="provider" type="button" data-provider="邮箱">
              <svg class="mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
              邮箱
            </button>
          </div>
          <p class="prototype-note">当前为 MVP 交互原型。微信、QQ 与邮箱正式授权将在接入学校账号系统及开放平台后启用。</p>
        </div>
      </section>
    </main>

    <footer>登录即表示你同意学校实验室的数据使用规范与隐私说明</footer>
  </div>

  <div class="dialog-backdrop" id="providerDialog" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="providerTitle">
      <div class="provider-badge" id="providerBadge" aria-hidden="true">Q</div>
      <div class="dialog-head">
        <div><h2 id="providerTitle">使用第三方账号登录</h2></div>
        <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p id="providerDescription"></p>
      <div id="emailFields" hidden>
        <div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="email" placeholder="name@university.edu.cn" /></div>
        <div class="field demo-row"><input id="emailCode" inputmode="numeric" maxlength="6" placeholder="6 位验证码" aria-label="邮箱验证码" /><button class="code-btn" id="sendCode" type="button">获取验证码</button></div>
      </div>
      <p class="dialog-status" id="dialogStatus" role="status" aria-live="polite"></p>
      <button class="primary" id="providerContinue" type="button">继续体验</button>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const formError = document.getElementById('formError');
    const fields = {
      name: document.getElementById('name'),
      phone: document.getElementById('phone'),
      identityId: document.getElementById('identityId')
    };
    const providerDialog = document.getElementById('providerDialog');
    const providerTitle = document.getElementById('providerTitle');
    const providerDescription = document.getElementById('providerDescription');
    const providerBadge = document.getElementById('providerBadge');
    const providerContinue = document.getElementById('providerContinue');
    const emailFields = document.getElementById('emailFields');
    const dialogStatus = document.getElementById('dialogStatus');
    const toast = document.getElementById('toast');
    let activeProvider = '';
    let lastFocused = null;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function clearInvalid() {
      Object.values(fields).forEach((field) => field.removeAttribute('aria-invalid'));
      formError.textContent = '';
    }

    function saveDemoSession(method, extra = {}) {
      sessionStorage.setItem('labmate_session', JSON.stringify({
        name: fields.name.value.trim() || '实验用户',
        phone: fields.phone.value.trim(),
        identityId: fields.identityId.value.trim(),
        loginMethod: method,
        ...extra
      }));
      window.location.href = 'lab.html';
    }

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();
      clearInvalid();
      const name = fields.name.value.trim();
      const phone = fields.phone.value.trim();
      const identityId = fields.identityId.value.trim();
      let invalidField = null;
      let message = '';
      if (!name) { invalidField = fields.name; message = '请输入用户名。'; }
      else if (!/^1[3-9]\d{9}$/.test(phone)) { invalidField = fields.phone; message = '请输入有效的 11 位手机号。'; }
      else if (!/^[A-Za-z0-9_-]{4,24}$/.test(identityId)) { invalidField = fields.identityId; message = '请输入 4–24 位有效学号或工号。'; }
      if (invalidField) {
        invalidField.setAttribute('aria-invalid', 'true');
        invalidField.focus();
        formError.textContent = message;
        return;
      }
      saveDemoSession('学校账号');
    });

    Object.values(fields).forEach((field) => field.addEventListener('input', () => {
      field.removeAttribute('aria-invalid');
      formError.textContent = '';
    }));

    function openProvider(provider, trigger) {
      activeProvider = provider;
      lastFocused = trigger;
      providerTitle.textContent = `使用${provider}登录`;
      providerBadge.textContent = provider === '微信' ? '微' : provider === 'QQ' ? 'Q' : '@';
      emailFields.hidden = provider !== '邮箱';
      dialogStatus.textContent = '';
      if (provider === '邮箱') {
        providerDescription.textContent = '输入学校或个人邮箱完成验证码登录。当前验证码流程为 MVP 演示。';
        providerContinue.textContent = '验证并登录';
      } else {
        providerDescription.textContent = `正式版将跳转到${provider}开放平台完成安全授权。当前可继续体验登录后的实验界面。`;
        providerContinue.textContent = '继续体验';
      }
      providerDialog.classList.add('open');
      document.body.style.overflow = 'hidden';
      window.setTimeout(() => document.getElementById('dialogClose').focus(), 10);
    }

    function closeProvider() {
      providerDialog.classList.remove('open');
      document.body.style.overflow = '';
      if (lastFocused) lastFocused.focus();
    }

    document.querySelectorAll('[data-provider]').forEach((button) => {
      button.addEventListener('click', () => openProvider(button.dataset.provider, button));
    });
    document.getElementById('dialogClose').addEventListener('click', closeProvider);
    providerDialog.addEventListener('click', (event) => { if (event.target === providerDialog) closeProvider(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && providerDialog.classList.contains('open')) closeProvider(); });

    document.getElementById('sendCode').addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        dialogStatus.textContent = '请先输入有效邮箱地址。';
        document.getElementById('email').focus();
        return;
      }
      dialogStatus.textContent = '演示验证码已发送，请输入任意 6 位数字。';
      showToast('验证码发送演示成功');
      document.getElementById('emailCode').focus();
    });

    providerContinue.addEventListener('click', () => {
      if (activeProvider === '邮箱') {
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('emailCode').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { dialogStatus.textContent = '请输入有效邮箱地址。'; return; }
        if (!/^\d{6}$/.test(code)) { dialogStatus.textContent = '请输入 6 位演示验证码。'; return; }
        saveDemoSession('邮箱', { email });
        return;
      }
      saveDemoSession(activeProvider);
    });
  </script>
</body>
</html>
