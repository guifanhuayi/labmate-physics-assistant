name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: labmate_test
          POSTGRES_USER: labmate
          POSTGRES_PASSWORD: labmate-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labmate -d labmate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://labmate:labmate-ci@localhost:5432/labmate_test
      TEST_DATABASE_URL: postgresql+psycopg://labmate:labmate-ci@localhost:5432/labmate_test
      COOKIE_SECURE: "false"
      SMS_DELIVERY_MODE: test
      SMS_VERIFICATION_TEST_CODE: "246810"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install backend
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Test backend and migrations
        run: |
          alembic upgrade head
          pytest
        working-directory: backend
      - name: Install frontend
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Test and build frontend
        run: |
          pnpm test
          pnpm build
        working-directory: frontend
      - name: Prepare end-to-end accounts
        env:
          LABMATE_SEED_TEACHER_PASSWORD: InitialPass2026
          LABMATE_SEED_ADMIN_PASSWORD: InitialPass2026
        run: |
          alembic downgrade base
          alembic upgrade head
          python -m app.seed
        working-directory: backend
      - name: Start application
        env:
          DEMO_AUTH_ENABLED: "true"
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/labmate-api.log 2>&1 &
          nohup pnpm --dir frontend dev --host 127.0.0.1 > /tmp/labmate-web.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
      - name: End-to-end login flow
        env:
          E2E_NEW_PASSWORD: ChangedPass2026
          E2E_SMS_CODE: "246810"
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
        working-directory: frontend
